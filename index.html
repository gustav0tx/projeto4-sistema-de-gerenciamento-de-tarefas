<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <header class="topo-app">
      <span class="simbolo">☑</span>
      <h1>Gerenciador de Tarefas</h1>
    </header>

    <main class="conteudo">
      <section class="bloco-formulario">
        <h2>Nova Tarefa</h2>

        <div class="campo-area">
          <input id="campoTexto" type="text" placeholder="Digite uma tarefa...">
          <button id="botaoAdicionar">Adicionar</button>
        </div>
      </section>

      <section class="linha-titulo">
        <h2>Suas Tarefas</h2>

        <div class="dados">
          <span>Total: <strong id="valorTotal">0</strong> tarefas</span>
          <span>Pendentes: <strong id="valorPendentes">0</strong></span>
          <span>Concluídas: <strong id="valorConcluidas">0</strong></span>
        </div>
      </section>

      <ul id="areaLista"></ul>
    </main>

    <footer class="rodape">Desenvolvido com ❤️</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
